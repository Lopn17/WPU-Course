<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Sneakers Card</title>
    <style>
        body{
            background-color: rgb(255, 248, 240);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif
        }
        .container{
            width: 350px;
            background-color: white;
            padding: 25px;
            margin: 50px auto;
            box-shadow: 0 0 10px rgb(190, 190, 190);
            border-radius: 15px;
        }

        img[src="sneakers.png"]{
            width: 100%;
            border-radius: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        img[src="sneakers.png"]:hover{
            transform: scale(0.95);
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.2);
        }

        .name{
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
            color: rgb(80, 80, 255);
        }

        h2{
            text-transform: capitalize;
            font-weight: 750;
            margin-top: 5px;
            margin-bottom: 10px;
        }
        .price{
            font-weight: 800;
            font-size: 28px;
        }
        sub{
            text-decoration: line-through;
            color: rgb(141, 141, 141);
            font-size: 20px;
            margin-left: 10px;
        }
        .caption{
            margin-top: 15px;
            font-weight: bold;
        }
        .size-box-container{
            display: flex;
            justify-content: space-between;
        }

        /* 1. Sembunyikan lingkaran radio button bawaan browser */
        .size-radio {
            display: none;
        }

        /* 2. Styling box ukuran sepatu (menggunakan label) */
        .size-box {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            
            border: 3px solid rgba(158, 158, 158, 0.345);
            height: 50px;
            width: 50px;
            color: rgb(97, 97, 97);
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        /* 3. Efek hover saat mouse berada di atas box yang belum dipilih */
        .size-box:hover {
            border-color: rgb(80, 80, 255);
            color: rgb(80, 80, 255);
        }

        /* 4. Trik CSS: Ubah gaya .size-box saat radio button di sebelahnya dalam kondisi :checked */
        .size-radio:checked + .size-box {
            background-color: rgb(80, 80, 255);
            border-color: rgb(80, 80, 255);
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="sneakers.png" alt="sneakers.png">
        <span class="name">nike sportswear</span>
        <h2>Air max essential</h2>
        <p>Kombinasi sempurna antara gaya retro dan kenyamanan modern. Dilengkapi dengan teknologi Air-Sole untuk bantalan yang responsif setiap hari.</p>
        <hr>
        <span class="price">Rp 1,899,000</span>
        <sub>Rp 2,299,000</sub>
        <p class="caption">Pilih ukuran (US):</p>
        
        <div class="size-box-container">
            <!-- Setiap input memiliki ID unik dan label yang terhubung lewat atribut 'for' -->
            <input type="radio" name="size" id="size8" class="size-radio">
            <label for="size8" class="size-box">8</label>

            <input type="radio" name="size" id="size9" class="size-radio">
            <label for="size9" class="size-box">9</label>

            <input type="radio" name="size" id="size10" class="size-radio">
            <label for="size10" class="size-box">10</label>

            <input type="radio" name="size" id="size11" class="size-radio">
            <label for="size11" class="size-box">11</label>

            <input type="radio" name="size" id="size12" class="size-radio">
            <label for="size12" class="size-box">12</label>
        </div>
    </div>
</body>
</html>
