<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Sneakers Card</title>
    <style>
        body{
            background-color: rgb(255, 248, 240);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif
        }
        .container{
            width: 350px;
            background-color: white;
            padding: 25px;
            margin: 50px auto;
            box-shadow: 0 0 10px rgb(190, 190, 190);
            border-radius: 15px;
        }

        img[src="sneakers.png"]{
            width: 100%;
            border-radius: 15px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        img[src="sneakers.png"]:hover{
            scale: calc(0.98);
            box-shadow: 0 0 25px red;
        }

        .name{
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
            color: rgb(80, 80, 255);
        }

        h2{
            text-transform: capitalize;
            font-weight: 750;
        }
        .price{
            font-weight: 800;
            font-size: 28px;
        }
        sub{
            text-decoration: line-through;
            color: rgb(141, 141, 141);
            font-size: 20px;
            margin-left: 10px;
        }
        .caption{
            margin-top: 10px;
            font-weight: bold;
        }
        .size-box-container{
            display: flex;
            box-sizing: border-box;
            justify-content: space-between;
        }

        .size-radio{
            display: none;
        }

        .size-box{
            display: inline-flex;
            justify-content: center;
            align-items: center;
            
            border: 3px solid rgba(158, 158, 158, 0.345);
            height: 50px;
            width: 50px;
            color: rgb(97, 97, 97);
            border-radius: 10px;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .size-box:hover{
            border: 3px solid black;
        }

        .size-radio:checked + .size-box{
            color: white;
            background-color: black;
        }

        .checkout{
            margin-top: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-transform: uppercase;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
            font-size: 15px;
            width: 100%;
            height: 50px;
            color: white;
            background-color: black;
            border-radius: 10px;
            box-shadow: 0 0 10px black;
            cursor: pointer;
        }        

        .checkout:active{
            box-shadow: 0 0 0 0;
            scale: calc(0.98);
        }
        
    </style>
</head>
<body>
    <article class="container">
        <img src="sneakers.png" alt="sneakers.png">
        <span class="name">nike sportswear</span>
        <h2>Air max essential</h2>
        <p>Kombinasi sempurna antara gaya retro dan kenyamanan modern. Dilengkapi dengan teknologi Air-Sole untuk bantalan yang responsif setiap hari.</p>
        <hr>
        <span class="price">Rp 1,899,000</span>
        <sub>Rp 2,299,000</sub>
        <p class="caption">Pilih ukuran (US):</p>
        <div class="size-box-container">

            <input type="radio" name="size" id="size8" class="size-radio" value="8">
            <label for="size8" class="size-box">8</label>

            <input type="radio" name="size" id="size9" class="size-radio" value="9">
            <label for="size9" class="size-box">9</label>

            <input type="radio" name="size" id="size10" class="size-radio" value="10">
            <label for="size10" class="size-box">10</label>

            <input type="radio" name="size" id="size11" class="size-radio" value="11">
            <label for="size11" class="size-box">11</label>

            <input type="radio" name="size" id="size12" class="size-radio" value="12">
            <label for="size12" class="size-box">12</label>
        </div>

        <button class="checkout">Tambahkan ke keranjang</button>

    </article>
</body>
</html>
